name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - Assets/Sounds/**
      - Assets/profiles.json
      - scripts/prepare_website.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare website and sound previews
        run: python3 scripts/prepare_website.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
